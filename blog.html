---
layout: default
title: Blog
permalink: /blog/
description: Essays, notes, and updates from Abdulkader Alturkmani.
---
<h1>Blog</h1>
<section class="essay-index" aria-label="Articles">
  {% for post in site.posts %}
  <article class="essay-index-entry">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time>
    <p>{{ post.excerpt | strip_html | truncate: 180 }}</p>
  </article>
  {% endfor %}
</section>
