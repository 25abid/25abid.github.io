<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#464646">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon" sizes="any">
    <link rel="icon" href="{{ '/assets/Ayin-favicon-dark.png' | relative_url }}" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link rel="icon" href="{{ '/assets/Ayin-favicon.png' | relative_url }}" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <title>
      {{ page.title | default: 'Portfolio' | escape }} — Abdulkader
    </title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <div class="page">
      <main class="main" id="main" tabindex="-1">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </body>
</html>
